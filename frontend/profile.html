<!DOCTYPE html>
<html>
<head>
    <title>Thông tin cá nhân</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

<div class="auth-container profile-box">

    <span class="close-btn"
          onclick="window.location.href='/'">×</span>

    <h2>Thông tin cá nhân</h2>

    <input id="fullName"
           placeholder="Họ và tên">

    <input id="phone"
           placeholder="Số điện thoại">

    <input id="address"
           placeholder="Địa chỉ">

    <button onclick="saveProfile()">
        Lưu thông tin
    </button>

</div>
<div id="messageModal"
     class="message-modal"
     style="display: none;">

    <div class="message-box">

        <span class="message-close"
              onclick="closeMessage()">
            &times;
        </span>

        <h2 id="messageTitle">
            Thông báo
        </h2>

        <p id="messageText"></p>

        <button class="message-ok"
                onclick="closeMessage()">
            OK
        </button>

    </div>

</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
