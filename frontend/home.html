<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Home</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="logo"
         onclick="window.location.href='/'">

        Mini Shop

    </div>


    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Tìm sản phẩm..."
        >

        <button onclick="searchProducts()">

            Tìm

        </button>

    </div>


    <nav>

        <a href="/"
           onclick="loadProducts()">

            Trang chủ

        </a>

        <a href="/products">

            Sản phẩm

        </a>

        <a href="#"
           onclick="loadRecommend()">

            Gợi ý

        </a>

        <a href="/cart">

            Giỏ hàng

        </a>


        <div id="authArea"></div>

    </nav>

</header>

<!-- SLIDER -->
<div class="container">
    <div class="slider">
        <img id="banner"
             src="https://down-vn.img.susercontent.com/file/sg-11134258-8261n-mmfw9oka07ig62@resize_w1594_nl.webp">

        <button class="nav prev" onclick="prevSlide()">❮</button>
        <button class="nav next" onclick="nextSlide()">❯</button>
    </div>
</div>

<!-- CATEGORY -->
<div class="container">
    <h2 class="section-title">DANH MỤC</h2>

    <div class="category-scroll">
        <div class="cat-item active" onclick="selectCategory(this, null)">Tất cả</div>
        <div class="cat-item" onclick="selectCategory(this, 'Điện thoại')">Điện thoại</div>
        <div class="cat-item" onclick="selectCategory(this, 'Phụ kiện điện thoại')">Phụ kiện</div>
        <div class="cat-item" onclick="selectCategory(this, 'Đồng hồ')">Đồng hồ</div>
        <div class="cat-item" onclick="selectCategory(this, 'Thời trang')">Thời trang</div>
        <div class="cat-item" onclick="selectCategory(this, 'Thực phẩm')">Thực phẩm</div>
    </div>
</div>

<!-- PRODUCTS -->
<div class="container">
    <h2 class="section-title">SẢN PHẨM</h2>
    <div class="product-grid" id="products"></div>
</div>

<!-- PRODUCT DETAIL -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="productDetail"></div>
    </div>
</div>

<!-- CHECKOUT -->
<div id="checkoutModal" class="modal">
    <div class="modal-content checkout-content">
        <span class="close" onclick="closeCheckout()">&times;</span>

        <h2>Thông tin đặt hàng</h2>

        <div class="checkout-form">
            <div class="form-row">
                <label>Tên người nhận <span>*</span></label>
                <input id="customerName" placeholder="Nhập tên người nhận">
            </div>

            <div class="form-row">
                <label>Số điện thoại <span>*</span></label>
                <input id="customerPhone" placeholder="Nhập số điện thoại">
            </div>

            <div class="form-row">
                <label>Địa chỉ nhận hàng <span>*</span></label>
                <input id="customerAddress" placeholder="Nhập địa chỉ nhận hàng">
            </div>
        </div>

        <div class="checkout-actions">
            <button class="btn-back" onclick="closeCheckout()">Quay lại</button>
            <button class="btn-buy" onclick="submitOrder()">Xác nhận đặt hàng</button>
        </div>
    </div>
</div>
<div id="toast" class="toast">
    <span id="toast-msg">Thành công</span>
    <span class="toast-close" onclick="closeToast()">×</span>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
