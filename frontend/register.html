<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

<div class="auth-container">
    <span class="close-btn" onclick="window.location.href='/'">×</span>
    <h2>Đăng ký</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <input id="confirmPassword" type="password" placeholder="Confirm Password">

    <button onclick="register()">Đăng ký</button>

    <p>Bạn đã có tài khoản ? <a href="/login">Đăng nhập</a></p>
</div>
<div id="messageModal" class="message-modal">
    <div id="messageBox" class="message-box">

        <span class="message-close"
              onclick="closeMessage()">&times;</span>

        <div id="messageIcon"
             class="message-icon">
            ✓
        </div>

        <h2 id="messageTitle">Thông báo</h2>

        <p id="messageText"></p>

        <button class="message-ok"
                onclick="closeMessage()">

            OK

        </button>

    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
