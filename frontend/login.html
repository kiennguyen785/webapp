<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}"></head>
<body>

<div class="auth-container">
    <span class="close-btn" onclick="window.location.href='/'">×</span>
    <h2>Đăng nhập</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Đăng nhập</button>

    <p>Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
</div>
<div id="messageModal">
    <div class="message-box">
        <span class="message-close" onclick="closeMessage()">&times;</span>
        <h2 id="messageTitle">Thông báo</h2>
        <p id="messageText"></p>
        <button class="message-ok" onclick="closeMessage()">OK</button>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
