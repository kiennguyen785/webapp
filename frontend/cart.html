<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Giỏ hàng</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="header">

    <div class="logo"
         onclick="window.location.href='/'">

        Mini Shop

    </div>

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="Tìm sản phẩm..."
        >

        <button onclick="searchProducts()">
            Tìm
        </button>

    </div>

    <nav>

        <a href="/">
            Trang chủ
        </a>

        <a href="/products">
            Sản phẩm
        </a>

        <a href="/recommend">
            Gợi ý
        </a>

        <a href="/cart"
           class="active-nav">
            Giỏ hàng
        </a>

        <div id="authArea">

            {% if username %}

                <div class="user-menu">

                    👤 {{ username }}

                    <div class="user-dropdown">

                        <div onclick="window.location.href='/profile'">
                            Thông tin cá nhân
                        </div>

                        <div onclick="window.location.href='/orders'">
                            Lịch sử mua hàng
                        </div>

                        <div onclick="logout()">
                            Đăng xuất
                        </div>

                    </div>

                </div>

            {% else %}

                <div class="auth-buttons">

                    <div class="auth-btn"
                         onclick="window.location.href='/login'">

                        Đăng nhập

                    </div>

                    <div class="auth-btn"
                         onclick="window.location.href='/register'">

                        Đăng ký

                    </div>

                </div>

            {% endif %}

        </div>

    </nav>

</header>

<div class="cart-page">

    <h1>Giỏ hàng của bạn</h1>

    <div id="cartItems"></div>

    <div class="cart-summary">

        <div id="cartTotal"></div>

        <button onclick="checkoutCart()">

            Đặt hàng

        </button>

    </div>

</div>

<div id="toast" class="toast">

    <span id="toast-msg">Thành công</span>

    <span class="toast-close"
          onclick="closeToast()">×</span>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>

loadCart();

</script>

</body>

</html>
